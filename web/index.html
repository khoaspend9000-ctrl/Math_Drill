<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MathDrill Web — M5 Player &amp; Save</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="1300" height="800" aria-label="MathDrill game canvas"></canvas>
    <div id="hud"></div>
    <div id="fatal-error" class="overlay" role="alert" aria-hidden="true">
      <div class="fatal-error-card">
        <h1>MathDrill gặp lỗi</h1>
        <pre class="fatal-error-body"></pre>
        <button type="button" id="fatal-error-retry">Tải lại trang</button>
      </div>
    </div>
  </div>

  <script src="js/logger.js"></script>
  <script src="js/errors.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/input.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/audio.js"></script>
  <!-- M8: performance.js (SurfaceCache) loads BEFORE effects.js so effects.js
       wins the global.particleBudget singleton that effects2.js consumes -->
  <script src="js/performance.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/effects2.js"></script>
  <!-- M5 player/save/auth -->
  <script src="js/save.js"></script>
  <script src="js/player.js"></script>
  <script src="js/auth.js"></script>
  <!-- M6 question stack: mt19937 -> question_generator -> smart_ai -> adaptive_ai -->
  <script src="js/data_loader.js"></script>
  <script src="js/mt19937.js"></script>
  <script src="js/question_generator.js"></script>
  <script src="js/smart_ai.js"></script>
  <script src="js/adaptive_ai.js"></script>
  <!-- M7 gameplay -->
  <script src="js/game_manager.js"></script>
  <script src="js/theory_pages.js"></script>
  <script src="js/ui.js"></script>
  <!-- M9 systems: player/save already loaded above -->
  <script src="js/shop.js"></script>
  <script src="js/pet.js"></script>
  <script src="js/skin.js"></script>
  <script src="js/gacha.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/daily.js"></script>
  <script src="js/skill_tree.js"></script>
  <script src="js/item_effects.js"></script>
  <script src="js/state_manager.js"></script>
    <script src="js/polish_m2.js"></script>
<script src="js/states_real.js"></script>
  <script src="js/settings_states.js"></script>

  <script src="js/main.js"></script>
</body>
</html>
